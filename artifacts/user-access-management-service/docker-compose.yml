version: '3.8'

services:
  uams:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8095:8095"
    environment:
      - PORT=8095
      - MONGODB_URI=mongodb://mongodb:27017/luma
      - SESSION_SECRET=super-secret-session-key-uams-service-12345
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
