syntax = "proto3";

package auth;

option go_package = "github.com/luma-smart-home/authentication-service/pkg/grpc";

service AuthService {
    rpc VerifyUserToken(VerifyTokenRequest) returns (VerifyTokenResponse);
    rpc IntrospectUserToken(IntrospectTokenRequest) returns (IntrospectTokenResponse);
    rpc CreateServiceToken(CreateServiceTokenRequest) returns (CreateServiceTokenResponse);
    rpc VerifyServiceToken(VerifyServiceTokenRequest) returns (VerifyServiceTokenResponse);
}

message VerifyTokenRequest {
    string token = 1;
}

message VerifyTokenResponse {
    bool valid = 1;
    string user_id = 2;
    string session_id = 3;
    string error_message = 4;
}

message IntrospectTokenRequest {
    string token = 1;
}

message IntrospectTokenResponse {
    bool active = 1;
    string user_id = 2;
    string session_id = 3;
    int64 exp = 4;
    string error_message = 5;
}

message CreateServiceTokenRequest {
    string client_id = 1;
    string client_secret = 2;
}

message CreateServiceTokenResponse {
    string access_token = 1;
    int64 expires_at = 2;
    string error_message = 3;
}

message VerifyServiceTokenRequest {
    string token = 1;
}

message VerifyServiceTokenResponse {
    bool valid = 1;
    string service_id = 2;
    string service_name = 3;
    string error_message = 4;
}
