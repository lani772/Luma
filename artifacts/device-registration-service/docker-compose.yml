version: '3.8'

services:
  drdms:
    build: .
    container_name: luma-drdms
    ports:
      - "8095:8095"
    environment:
      - PORT=8095
      - GIN_MODE=release
      - DATABASE_URL=postgres://postgres:postgres@db:5432/luma_drdms?sslmode=disable
      - DEVICE_ENCRYPTION_KEY=12345678901234567890123456789012
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: luma-drdms-db
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=luma_drdms
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
