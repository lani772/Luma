openapi: 3.1.0
info:
  title: LUMA Device Registration & Device Management Service (DRDMS) API
  version: 1.0.0
  description: REST API for physical hardware registration, simulation, AI firmware config, room management, and credentials.
paths:
  /api/v1/controllers/register/start:
    post:
      summary: Start Simulation & AI assistant setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
                - controller_type
              properties:
                prompt:
                  type: string
                  example: "Create ESP32 controller with 6 lamps, 2 fans"
                controller_type:
                  type: string
                  example: "ESP32"
      responses:
        '201':
          description: Simulation generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulation_id:
                    type: string
                  registration_token:
                    type: string
                  gpio_mappings:
                    type: object
                  resources:
                    type: array
                    items:
                      type: object

  /api/v1/controllers/register/firmware/{simulation_id}:
    get:
      summary: Download complete compile-ready Arduino project ZIP
      parameters:
        - name: simulation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Raw ZIP bytes containing source files
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /api/v1/controllers/register/complete:
    post:
      summary: Microcontroller first-boot registration / claim endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - registration_token
                - serial_number
                - mac_address
                - chip_id
              properties:
                registration_token:
                  type: string
                serial_number:
                  type: string
                mac_address:
                  type: string
                chip_id:
                  type: string
      responses:
        '200':
          description: Registration completed. Return permanent device credentials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  controller_id:
                    type: string
                  device_api_key:
                    type: string
                  mqtt_username:
                    type: string
                  mqtt_password:
                    type: string

  /api/v1/controllers:
    get:
      summary: List registered controllers
      responses:
        '200':
          description: List of controllers (Separated DTO view based on Owner/Admin roles)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/v1/controllers/{id}:
    get:
      summary: Get Controller details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Owner view contains MAC & pin config. Public view hides them.

  /api/v1/controllers/{id}/hardware-config:
    patch:
      summary: Update physical pin mapping
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mapping updated
