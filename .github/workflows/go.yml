# This workflow will build the golang projects in their respective folders
name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Build and Test LUMA Cloud Backend
      run: |
        cd artifacts/luma-cloud-backend
        go build -v ./...
        go test -v ./...

    - name: Build and Test MQTT Service
      run: |
        cd mqtt-service
        go build -v ./...
        go test -v ./...
